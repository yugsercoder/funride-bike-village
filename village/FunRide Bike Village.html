<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>FunRide Bike Village</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&family=Inter:wght@400;500;600&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="app">
  <canvas id="scene" aria-label="3D model of the FunRide PH bike village at Rizal Park"></canvas>
  <div id="tags"></div>

  <button id="reopen" class="panel" hidden aria-label="Show the info boxes again">Info</button>
  <header class="brand panel" id="brandBox">
    <button class="closeb" aria-label="Close this box" title="Close (Esc)">×</button>
    <button class="minbtn" aria-label="Minimise" aria-expanded="true">−</button>
    <h1>Bike Village</h1>
    <div class="live hide-min"><span class="dot">Live</span><span id="clock">--:--</span></div>
  </header>

  <nav class="modes panel" aria-label="View mode">
    <button id="mTour" aria-pressed="true">Guided tour</button>
    <button id="mWalkthrough" aria-pressed="false">Walkthrough</button>
    <button id="mFree" aria-pressed="false">Explore</button>
    <button id="mTop" aria-pressed="false">Top view</button>
    <button id="dirToggle" aria-pressed="false">Booth list</button>
    <button id="mMore" class="more" aria-expanded="false" aria-haspopup="true" aria-label="More options">⋯</button>
  </nav>
  <div id="moreMenu" class="panel" hidden>
    <button id="mSim" aria-pressed="true">Simulation on</button>
    <button id="mClean" aria-pressed="false" title="Hide the info boxes for a full view (H)">Hide panels</button>
  </div>

  <aside id="dir" class="panel" aria-label="Booth directory">
    <header>
      <h2>Legend &amp; booth list</h2>
      <button class="minbtn" aria-label="Minimise" aria-expanded="true">−</button>
      <div class="dsub hide-min">FunRide PH · Rizal Park, Manila · Booths at true size, layout approximate</div>
      <div class="dstat hide-min" id="stats">Waiting for wave 1</div>
      <input id="q" class="hide-min" type="search" placeholder="Find a booth, e.g. EMS" autocomplete="off">
    </header>
    <div class="list hide-min" id="list"></div>
  </aside>

  <section id="bar" class="panel" aria-live="polite">
    <button class="closeb" aria-label="Close this box" title="Close (Esc)">×</button>
    <button class="minbtn" aria-label="Minimise" aria-expanded="true">−</button>
    <div class="kicker"><span id="bKick">Guided tour</span><span id="bCount"></span></div>
    <div class="phase hide-min" id="phaseSw" hidden role="group" aria-label="Walkthrough phase">
      <button id="phLive" aria-pressed="false" hidden>Live</button>
      <button id="phMorning" aria-pressed="true">Morning</button>
      <button id="phAfter" aria-pressed="false">After the race</button>
    </div>
    <h2 id="bTitle">Welcome</h2>
    <p id="bText" class="hide-min"></p>
    <div class="progress hide-min" id="bProg"><i></i></div>
    <div class="ctrls hide-min" id="bCtrls">
      <button id="prev" aria-label="Previous stop">Back</button>
      <button id="play" class="primary">Pause tour</button>
      <button id="next" aria-label="Next stop">Next</button>
      <button id="gunBtn" class="primary" hidden>Gun start</button>
      <div class="dots" id="dots"></div>
    </div>
  </section>

  <div id="info" class="panel" hidden>
    <button class="x" id="infoX" aria-label="Close">×</button>
    <button class="minbtn" aria-label="Minimise" aria-expanded="true">−</button>
    <div class="cat hide-min"><span class="sw" id="iSw"></span><span id="iCat"></span></div>
    <h3 id="iName"></h3>
    <div class="size hide-min" id="iSize" hidden><b id="iSzV"></b><span id="iType"></span></div>
    <p id="iDesc" class="hide-min"></p>
  </div>
  <div id="toast"></div>
  <div id="loading">Building the bike village…</div>
</div>

<script src="logos.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script src="main.js"></script>
</body>
</html>
