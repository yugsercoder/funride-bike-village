<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>FunRide Bike Village</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&family=Inter:wght@400;500;600&display=swap">
<style>
/* Layout: full-bleed 3D scene; floating map-legend style panels (navy / red / yellow flag stripe). Single light look by design. */
:root{
  --navy:#16187a; --navy-2:#23219c; --red:#c8202f; --yellow:#ffc928;
  --panel:rgba(255,255,255,.95); --ink:#16183f; --muted:#5b5f86; --line:#dfe2ef; --sky:#cfe6f7;
  --display:"Oswald","Arial Narrow",Impact,sans-serif; --body:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
[hidden]{display:none!important}
html,body{height:100%;background:var(--sky);color:var(--ink);font-family:var(--body);overflow:hidden}
#app{position:fixed;inset:0;overflow:hidden}
#scene{display:block;width:100%;height:100%;touch-action:none;cursor:grab}
#scene.hovering{cursor:pointer}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--yellow);outline-offset:2px}

.panel{background:var(--panel);border-radius:12px;box-shadow:0 6px 24px rgba(22,24,122,.16);backdrop-filter:blur(6px)}
.stripe{display:flex;gap:4px}
.stripe i{display:block;height:4px;border-radius:2px;width:22px}
.stripe i:nth-child(1){background:var(--navy-2)}.stripe i:nth-child(2){background:var(--red)}.stripe i:nth-child(3){background:var(--yellow)}

.brand{position:absolute;top:calc(env(safe-area-inset-top,0px) + 16px);left:max(16px,env(safe-area-inset-left,0px));padding:14px 16px 12px;display:grid;gap:6px;max-width:300px}
.brand .eyebrow{font:600 11px/1 var(--body);letter-spacing:.14em;text-transform:uppercase;color:var(--red)}
.brand h1{margin:0;font:700 28px/1 var(--display);letter-spacing:.02em;color:var(--navy);text-transform:uppercase}
.brand .sub{font-size:12px;color:var(--muted)}
.live{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;font-size:12px;color:var(--ink);font-variant-numeric:tabular-nums;margin-top:2px}
.live .dot{display:inline-flex;align-items:center;gap:6px;font:700 11px/1 var(--display);letter-spacing:.1em;color:#fff;background:var(--red);padding:4px 7px;border-radius:4px}
.live .dot::before{content:"";width:7px;height:7px;border-radius:50%;background:#fff;animation:blink 1.4s infinite}
@keyframes blink{50%{opacity:.25}}

.modes{position:absolute;top:calc(env(safe-area-inset-top,0px) + 16px);right:max(16px,env(safe-area-inset-right,0px));display:flex;gap:6px;padding:6px;flex-wrap:wrap;justify-content:flex-end}
.modes button{border:0;background:transparent;padding:8px 12px;border-radius:8px;font:600 13px/1 var(--body);color:var(--navy)}
.modes button:hover{background:#eef0fb}
.modes button[aria-pressed="true"]{background:var(--navy);color:#fff}
.modes .sep{width:1px;background:var(--line);margin:4px 2px}

#dir{position:absolute;top:calc(env(safe-area-inset-top,0px) + 76px);right:max(16px,env(safe-area-inset-right,0px));width:280px;max-height:calc(100% - 300px);display:flex;flex-direction:column;overflow:hidden}
#dir header{padding:12px 14px 8px;display:grid;gap:8px;border-bottom:1px solid var(--line)}
#dir h2{margin:0;font:700 15px/1 var(--display);letter-spacing:.08em;text-transform:uppercase;color:var(--navy)}
#dir input{width:100%;box-sizing:border-box;border:1px solid var(--line);border-radius:8px;padding:8px 10px;font:14px var(--body);background:#fff;color:var(--ink)}
#dir .list{overflow:auto;padding:6px 8px 12px}
.grp{margin-top:8px}
.grp h3{display:flex;align-items:center;gap:8px;margin:6px 6px 4px;font:700 12px/1.2 var(--display);letter-spacing:.08em;text-transform:uppercase;color:var(--navy)}
.sw{width:12px;height:12px;border-radius:3px;flex:none;box-shadow:inset 0 0 0 1px rgba(0,0,0,.12)}
.grp button{display:flex;width:100%;text-align:left;border:0;background:transparent;padding:6px 8px 6px 26px;border-radius:6px;font-size:13px;color:var(--ink)}
.grp button:hover,.grp button.on{background:#eef0fb;color:var(--navy)}
.grp button small{margin-left:auto;color:var(--muted)}
#dirToggle{display:none}

#bar{position:absolute;left:max(16px,env(safe-area-inset-left,0px));bottom:calc(env(safe-area-inset-bottom,0px) + 16px);width:min(560px,calc(100% - 32px));padding:14px 16px;display:grid;gap:8px}
#bar .kicker{display:flex;justify-content:space-between;gap:8px;font:600 11px/1 var(--body);letter-spacing:.12em;text-transform:uppercase;color:var(--red)}
#bar .kicker span:last-child{color:var(--muted);font-variant-numeric:tabular-nums}
#bar h2{margin:0;font:700 22px/1.1 var(--display);color:var(--navy);text-transform:uppercase;letter-spacing:.02em;text-wrap:balance}
#bar p{margin:0;font-size:14px;line-height:1.5;color:var(--ink);max-width:62ch}
.ctrls{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.ctrls button{border:1px solid var(--line);background:#fff;padding:8px 12px;border-radius:8px;font:600 13px/1 var(--body);color:var(--navy)}
.ctrls button.primary{background:var(--navy);border-color:var(--navy);color:#fff}
.ctrls button:hover{border-color:var(--navy)}
.dots{display:flex;gap:4px;flex-wrap:wrap;margin-left:auto}
.dots button{width:9px;height:9px;padding:0;border-radius:50%;border:0;background:#cdd1e6}
.dots button.on{background:var(--red)}
.progress{height:3px;background:#e6e8f3;border-radius:2px;overflow:hidden}
.progress i{display:block;height:100%;width:0;background:var(--yellow)}

#info{position:absolute;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(env(safe-area-inset-bottom,0px) + 16px);width:280px;padding:14px 16px;display:grid;gap:6px}
#info .cat{display:flex;align-items:center;gap:8px;font:600 11px/1 var(--body);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
#info h3{margin:0;font:700 20px/1.1 var(--display);color:var(--navy);text-transform:uppercase}
#info p{margin:0;font-size:13px;line-height:1.5}
#info .size{display:flex;flex-wrap:wrap;gap:4px 8px;align-items:baseline;font-size:12px;color:var(--muted)}
#info .size b{font:700 13px/1.2 var(--body);color:#fff;background:var(--navy);padding:4px 7px;border-radius:5px;font-variant-numeric:tabular-nums}
#info .x{position:absolute;top:8px;right:8px;border:0;background:transparent;font-size:18px;line-height:1;padding:6px;color:var(--muted)}

#tags{position:absolute;inset:0;pointer-events:none}
.tag{position:absolute;left:0;top:0;transform:translate(-50%,-100%);white-space:nowrap;font:600 11px/1 var(--body);color:#fff;background:var(--navy);padding:5px 7px;border-radius:5px;box-shadow:0 2px 8px rgba(0,0,0,.2)}
.tag::after{content:"";position:absolute;left:50%;bottom:-4px;margin-left:-4px;border:4px solid transparent;border-bottom:0;border-top-color:var(--navy)}
.tag.hover{background:var(--red)}.tag.hover::after{border-top-color:var(--red)}

#loading{position:absolute;inset:0;display:grid;place-items:center;background:var(--sky);font:700 18px var(--display);letter-spacing:.1em;text-transform:uppercase;color:var(--navy);transition:opacity .6s}
#loading.done{opacity:0;pointer-events:none}
#toast{position:absolute;left:50%;top:calc(env(safe-area-inset-top,0px) + 16px);transform:translate(-50%,-140%);background:var(--red);color:#fff;font:700 14px/1 var(--display);letter-spacing:.08em;text-transform:uppercase;padding:9px 14px;border-radius:8px;transition:transform .35s;pointer-events:none}
#toast.show{transform:translate(-50%,0)}

@media (max-width:820px){
  .brand{padding:10px 12px;max-width:calc(100% - 32px)}
  .brand h1{font-size:22px}
  .modes{top:auto;right:auto;left:max(16px,env(safe-area-inset-left,0px));bottom:auto;position:absolute;top:calc(env(safe-area-inset-top,0px) + 128px);flex-wrap:nowrap;overflow-x:auto;max-width:calc(100% - 32px);box-sizing:border-box;justify-content:flex-start}
  .modes button{white-space:nowrap;padding:8px 10px}
  #dirToggle{display:inline-block}
  #dir{display:none;top:calc(env(safe-area-inset-top,0px) + 180px);left:max(16px,env(safe-area-inset-left,0px));right:max(16px,env(safe-area-inset-right,0px));width:auto;max-height:calc(100% - 200px);z-index:5}
  #dir.open{display:flex}
  #bar{width:calc(100% - 32px);box-sizing:border-box;padding:12px}
  #bar h2{font-size:18px}
  #bar p{font-size:13px}
  #info{left:max(16px,env(safe-area-inset-left,0px));width:auto;bottom:auto;top:calc(env(safe-area-inset-top,0px) + 180px);z-index:6}
}
@media (prefers-reduced-motion:reduce){.live .dot::before{animation:none}}
</style>

<div id="app">
  <canvas id="scene" aria-label="3D model of the FunRide PH bike village at Rizal Park"></canvas>
  <div id="tags"></div>

  <header class="brand panel">
    <div class="eyebrow">FunRide PH · Event site</div>
    <h1>Bike Village</h1>
    <div class="sub">Rizal Park, Manila · Booths at true size, site layout approximate</div>
    <div class="stripe" aria-hidden="true"><i></i><i></i><i></i></div>
    <div class="live"><span class="dot">Live</span><span id="clock">--:--</span><span id="stats">Waiting for wave 1</span></div>
  </header>

  <nav class="modes panel" aria-label="View mode">
    <button id="mTour" aria-pressed="true">Guided tour</button>
    <button id="mWalk" aria-pressed="false">Walk the lanes</button>
    <button id="mFree" aria-pressed="false">Explore freely</button>
    <button id="mTop" aria-pressed="false">Top view</button>
    <span class="sep"></span>
    <button id="mSim" aria-pressed="true">Simulation on</button>
    <button id="dirToggle" aria-pressed="false">Booth list</button>
  </nav>

  <aside id="dir" class="panel" aria-label="Booth directory">
    <header>
      <h2>Legend &amp; booth list</h2>
      <input id="q" type="search" placeholder="Find a booth, e.g. EMS" autocomplete="off">
    </header>
    <div class="list" id="list"></div>
  </aside>

  <section id="bar" class="panel" aria-live="polite">
    <div class="kicker"><span id="bKick">Guided tour</span><span id="bCount"></span></div>
    <h2 id="bTitle">Welcome</h2>
    <p id="bText"></p>
    <div class="progress" id="bProg"><i></i></div>
    <div class="ctrls" id="bCtrls">
      <button id="prev" aria-label="Previous stop">Back</button>
      <button id="play" class="primary">Pause tour</button>
      <button id="next" aria-label="Next stop">Next</button>
      <div class="dots" id="dots"></div>
    </div>
  </section>

  <div id="info" class="panel" hidden>
    <button class="x" id="infoX" aria-label="Close">×</button>
    <div class="cat"><span class="sw" id="iSw"></span><span id="iCat"></span></div>
    <h3 id="iName"></h3>
    <div class="size" id="iSize" hidden><b id="iSzV"></b><span id="iType"></span></div>
    <p id="iDesc"></p>
  </div>
  <div id="toast"></div>
  <div id="loading">Building the bike village…</div>
</div>

/* ---------- textures with text ---------- */
const FONT = 'Oswald, "Arial Narrow", Impact, sans-serif';
function textCanvas(text, wU, hU, o){
  o = o || {};
  const ppu = o.ppu || 40;
  let cw = Math.max(32, Math.round(wU * ppu)), ch = Math.max(32, Math.round(hU * ppu));
  const k = Math.min(1, 1024 / Math.max(cw, ch)); cw = Math.round(cw * k); ch = Math.round(ch * k);
  const cv = document.createElement('canvas'); cv.width = cw; cv.height = ch;
  const g = cv.getContext('2d');
  if (o.pill){
    const r = Math.min(cw, ch) * .5;
    g.fillStyle = o.bg; g.beginPath();
    if (g.roundRect) g.roundRect(1, 1, cw - 2, ch - 2, r); else g.rect(0, 0, cw, ch);
    g.fill();
  } else if (o.bg){ g.fillStyle = o.bg; g.fillRect(0, 0, cw, ch); }
  if (o.border){ g.strokeStyle = o.border; g.lineWidth = Math.max(2, Math.min(cw, ch) * .04); g.strokeRect(0, 0, cw, ch); }
  if (text){
    g.save();
    let W = cw, H = ch;
    if (o.vert){ g.translate(cw / 2, ch / 2); g.rotate(-Math.PI / 2); W = ch; H = cw; g.translate(-W / 2, -H / 2); }
    const lines = text.split('\n');
    let fs = H * (o.fill || .62) / lines.length;
    g.font = `700 ${fs}px ${FONT}`;
    const mw = Math.max(...lines.map(l => g.measureText(l).width));
    const maxW = W * (o.pill ? .8 : .86);
    if (mw > maxW) fs *= maxW / mw;
    g.font = `700 ${fs}px ${FONT}`;
    g.fillStyle = o.fg; g.textAlign = 'center'; g.textBaseline = 'middle';
    lines.forEach((l, i) => g.fillText(l, W / 2, H / 2 + (i - (lines.length - 1) / 2) * fs * 1.08));
    g.restore();
  }
  const t = new THREE.CanvasTexture(cv);
  t.encoding = THREE.sRGBEncoding; t.anisotropy = renderer.capabilities.getMaxAnisotropy();
  return t;
}
function faceMat(text, wU, hU, bg, fg, vert){
  if (!text || wU * hU < .35) return new THREE.MeshStandardMaterial({color:col(bg), roughness:.75});
  return new THREE.MeshStandardMaterial({map:textCanvas(text, wU, hU, {bg, fg, vert}), roughness:.75});
}
function flatLabel(text, px, py, wpx, hpx, o){
  o = o || {};
  const w = wpx / S, h = hpx / S;
  const tex = textCanvas(text, w, h, Object.assign({bg:'#ffffff', fg:'#16187a', pill:true, ppu:60}, o));
  const m = new THREE.Mesh(new THREE.PlaneGeometry(w, h), new THREE.MeshBasicMaterial({map:tex, transparent:true, depthWrite:false}));
  m.rotation.x = -Math.PI / 2;
  if (o.rot) m.rotation.z = o.rot * Math.PI / 180;
  m.position.set(X(px), o.y || .08, Z(py));
  m.renderOrder = 2;
  scene.add(m);
  return m;
}

/* ---------- ground ---------- */
function rect(x1, y1, x2, y2, color, y, recv){
  const m = new THREE.Mesh(new THREE.PlaneGeometry((x2 - x1) / S, (y2 - y1) / S), new THREE.MeshStandardMaterial({color:col(color), roughness:1}));
  m.rotation.x = -Math.PI / 2; m.position.set(X((x1 + x2) / 2), y, Z((y1 + y2) / 2));
  m.receiveShadow = recv !== false; scene.add(m); return m;
}
function polyFloor(pts, color, y){
  const sh = new THREE.Shape(pts.map(([x, yy]) => new THREE.Vector2(X(x), -Z(yy))));
  const m = new THREE.Mesh(new THREE.ShapeGeometry(sh), new THREE.MeshStandardMaterial({color:col(color), roughness:.95}));
  m.rotation.x = -Math.PI / 2; m.position.y = y; m.receiveShadow = true; scene.add(m); return m;
}

function dashes(x1, y1, x2, y2, dash, gap, width, y, mat){
  const a = new V3(X(x1), 0, Z(y1)), b = new V3(X(x2), 0, Z(y2));
  const L = a.distanceTo(b), dir = b.clone().sub(a).normalize(), ang = Math.atan2(-dir.z, dir.x);
  const geo = new THREE.BoxGeometry(dash, .02, width);
  const n = Math.floor(L / (dash + gap));
  const im = new THREE.InstancedMesh(geo, mat || dashMat, n);
  const o = new THREE.Object3D();
  for (let i = 0; i < n; i++){
    const d = i * (dash + gap) + dash / 2;
    o.position.copy(a).addScaledVector(dir, d); o.position.y = y || .03; o.rotation.set(0, ang, 0); o.updateMatrix();
    im.setMatrixAt(i, o.matrix);
  }
  scene.add(im); return im;
}

function wallSeg(x1, y1, x2, y2, h, t, mat){

  const m = new THREE.Mesh(new THREE.BoxGeometry(L, h, t), mat);

}

  const topMat = it.topLogo

    : new THREE.MeshStandardMaterial({map:textCanvas(label, w, d, {bg:c.bg, fg:c.fg, vert:it.vert}), roughness:.7});

  const pad = new THREE.Mesh(new THREE.PlaneGeometry(w, d), new THREE.MeshStandardMaterial({color:col(c.bg), roughness:1, transparent:true, opacity:.35}));
  pad.rotation.x = -Math.PI / 2; pad.position.y = .045; g.add(pad);

  if (it.tent === 'stall'){

    const counter = new THREE.Mesh(new THREE.BoxGeometry(w * .9, 1, .5), [plain, plain, topMat, plain, faceMat(flat, w * .9, 1, c.bg, c.fg), faceMat(flat, w * .9, 1, c.bg, c.fg)]);
    counter.position.set(0, .5, d / 2 - .35); g.add(counter);
    const panel = new THREE.Mesh(new THREE.BoxGeometry(w, 2.2, .08), [plain, plain, plain, plain, faceMat(flat, w, 2.2, c.bg, c.fg), plain]);
    panel.position.set(0, 1.1, -d / 2 + .1); g.add(panel);
    it.top = 2.2; return g;

  if (it.tent === 'aircon'){
    // enclosed VIP tent: white walls, peaked roof, door on the front, AC unit at the back
    const wallH = 2.5, white = new THREE.MeshStandardMaterial({color:col('#f4f6fb'), roughness:.6});

    box.position.y = wallH / 2; g.add(box);
    const roof = new THREE.Mesh(new THREE.BoxGeometry(w + .3, .22, d + .3), [plain, plain, topMat, plain, plain, plain]);
    roof.position.y = wallH + .11; g.add(roof);
    const door = new THREE.Mesh(new THREE.PlaneGeometry(1, 2.1), new THREE.MeshStandardMaterial({color:col('#2a2c3a')}));
    door.position.set(-bx * (w / 2 + .01), 1.05, -bz * (d / 2 + .01)); door.rotation.y = Math.atan2(-bx, -bz); g.add(door);
    const ac = new THREE.Mesh(new THREE.BoxGeometry(.9, .7, .5), new THREE.MeshStandardMaterial({color:col('#c9ced8'), roughness:.5}));
    ac.position.set(bx * (w / 2 + .3), .35, bz * (d / 2 + .3)); ac.rotation.y = Math.atan2(bx, bz); g.add(ac);
    it.top = wallH + .3; return g;

  // pop-up canopy (open tent / tent with back siding)
  const eave = 2.3, valH = .3;
  [[-1, -1], [1, -1], [1, 1], [-1, 1]].forEach(([sx, sz]) => {
    const p = new THREE.Mesh(new THREE.CylinderGeometry(.04, .04, eave, 6), poleMat);
    p.position.set(sx * (w / 2 - .05), eave / 2, sz * (d / 2 - .05)); g.add(p);

    faceMat(flat, d, valH * 3, c.bg, c.fg), faceMat(flat, d, valH * 3, c.bg, c.fg), topMat, plain,
    faceMat(flat, w, valH * 3, c.bg, c.fg), faceMat(flat, w, valH * 3, c.bg, c.fg)]);
  canopy.position.y = eave + valH / 2; g.add(canopy);
  if (it.tent === 'back'){
    const along = bx !== 0 ? d : w;
    const wall = new THREE.Mesh(new THREE.BoxGeometry(along, eave, .05), plain);
    wall.position.set(bx * (w / 2 - .03), eave / 2, bz * (d / 2 - .03));

  table.rotation.y = fx !== 0 ? Math.PI / 2 : 0; g.add(table);
  it.top = eave + valH; return g;
}

/* ---------- branded sponsor setups (DOT, Oxecure / Dr. O, BDO, Specialign) ----------
   Built from the sample tent designs: peaked branded canopy, backdrop, main table (4 x 2 x 3 ft),

   and beside the tent an 8 x 4 ft photo wall with 3D letters on a plinth. */
const LOGO = {};
{
  const imgs = window.FR_LOGO_IMG || {};
  const greyInvert = (d, i) => { const mx = Math.max(d[i], d[i+1], d[i+2]), mn = Math.min(d[i], d[i+1], d[i+2]); if (mx - mn < 46){ const v = 255 - (mx + mn) / 2; d[i] = d[i+1] = d[i+2] = v; } };
  const blueToWhite = (d, i) => { if (d[i+2] > d[i] + 40 && d[i+2] >= d[i+1]){ d[i] = d[i+1] = d[i+2] = 255; } };
  const prep = (key, from, map) => {
    const img = imgs[from]; if (!img || !img.naturalWidth) return;
    const w = img.naturalWidth, h = img.naturalHeight;
    const cv = document.createElement('canvas'); cv.width = w; cv.height = h;
    const g = cv.getContext('2d'); g.drawImage(img, 0, 0);
    const id = g.getImageData(0, 0, w, h), d = id.data;
    // opaque background (a few px in from the corner): knock out the white paper
    const paper = d[((Math.floor(h * .03) * w) + Math.floor(w * .03)) * 4 + 3] > 250;
    let x0 = w, y0 = h, x1 = -1, y1 = -1;
    for (let y = 0; y < h; y++) for (let x = 0; x < w; x++){
      const i = (y * w + x) * 4;
      if (paper){ const m = Math.min(d[i], d[i+1], d[i+2]); if (m > 205) d[i+3] = Math.round(d[i+3] * Math.max(0, (245 - m) / 40)); }
      if (d[i+3] > 24){ if (map) map(d, i); if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y; }
    }
    if (x1 < 0) return;
    g.putImageData(id, 0, 0);
    const out = document.createElement('canvas'); out.width = x1 - x0 + 1; out.height = y1 - y0 + 1;
    out.getContext('2d').drawImage(cv, x0, y0, out.width, out.height, 0, 0, out.width, out.height);
    LOGO[key] = out;
  };
  prep('frph', 'frph'); prep('frphW', 'frph', blueToWhite);
  prep('bdo', 'bdo'); prep('bdoW', 'bdo', blueToWhite);
  prep('spec', 'specialign'); prep('specW', 'specialign', greyInvert);
  prep('dro', 'dro'); prep('droW', 'dro', greyInvert);
  prep('oxecure', 'oxecure');
  prep('byd', 'byd'); prep('bydW', 'byd', greyInvert);
}

function artTex(wM, hM, draw, ppm){
  ppm = ppm || 230;
  let cw = Math.round(wM * ppm), ch = Math.round(hM * ppm);
  const k = Math.min(1, 2048 / Math.max(cw, ch)); cw = Math.max(16, Math.round(cw * k)); ch = Math.max(16, Math.round(ch * k));
  const cv = document.createElement('canvas'); cv.width = cw; cv.height = ch;
  draw(cv.getContext('2d'), cw, ch);
  const t = new THREE.CanvasTexture(cv); t.encoding = THREE.sRGBEncoding; t.anisotropy = renderer.capabilities.getMaxAnisotropy();
  return t;
}
const artMat = (wM, hM, draw, o) => new THREE.MeshStandardMaterial(Object.assign({map:artTex(wM, hM, draw), roughness:.8}, o || {}));
const solid = (c, o) => new THREE.MeshStandardMaterial(Object.assign({color:col(c), roughness:.75}, o || {}));
// draw a logo fitted inside a (mw x mh) box centred on (cx, cy); returns the drawn width
function logo(g, key, cx, cy, mw, mh){
  const L = LOGO[key]; if (!L) return 0;
  const s = Math.min(mw / L.width, mh / L.height), w = L.width * s, h = L.height * s;
  g.drawImage(L, cx - w / 2, cy - h / 2, w, h); return w;
}
function vlogo(g, key, cx, cy, mw, mh){ g.save(); g.translate(cx, cy); g.rotate(-Math.PI / 2); logo(g, key, 0, 0, mh, mw); g.restore(); }
// FunRide PH logo | sponsor logo, centred on (cx, cy), h = FunRide logo height
function lockup(g, cx, cy, h, right, o){
  o = o || {};
  const fr = LOGO[o.fr || 'frph'], R = LOGO[right];
  const fw = fr ? fr.width / fr.height * h : 0, rh = h * (o.rh || .6);
  let rw = R ? R.width / R.height * rh : 0;
  if (o.maxW){ const room = o.maxW - fw - h * .5; if (rw > room) rw = Math.max(0, room); }
  const gap = h * .2, tot = fw + gap * 2 + rw;
  let x = cx - tot / 2;
  if (fr) g.drawImage(fr, x, cy - h / 2, fw, h);
  x += fw + gap;
  g.fillStyle = o.line || '#16183f'; g.fillRect(x - h * .012, cy - h * .36, Math.max(2, h * .024), h * .72);
  x += gap;
  if (R){ const rH = rw * R.height / R.width; g.drawImage(R, x, cy - rH / 2, rw, rH); }
}
function band(g, color, p){
  g.fillStyle = color; g.beginPath(); g.moveTo(p[0], p[1]); g.quadraticCurveTo(p[2], p[3], p[4], p[5]);
  g.lineTo(p[6], p[7]); g.quadraticCurveTo(p[8], p[9], p[10], p[11]); g.closePath(); g.fill();
}
const lin = (g, x0, y0, x1, y1, stops) => { const gr = g.createLinearGradient(x0, y0, x1, y1); stops.forEach(([o, c]) => gr.addColorStop(o, c)); return gr; };
// red / yellow / blue Philippine wave along the bottom (DOT)
function waves(g, W, H, y0, flip){
  const h = H - y0;
  [[DOTC.yellow, 0], [DOTC.red, .3], [DOTC.blue, .55]].forEach(([c, o]) => {
    g.fillStyle = c; g.beginPath();
    const a = y0 + h * o, b = y0 + h * (o + .25);
    if (flip){ g.moveTo(0, b); g.bezierCurveTo(W * .35, a - h * .2, W * .65, b + h * .25, W, a); }
    else { g.moveTo(0, a); g.bezierCurveTo(W * .35, b + h * .25, W * .65, a - h * .2, W, b); }
    g.lineTo(W, H); g.lineTo(0, H); g.closePath(); g.fill();
  });
}
function stepRepeat(g, x0, y0, x1, y1, pw){
  const ph = pw * .17, cols = Math.max(1, Math.floor((x1 - x0) / (pw * 1.35))), rows = Math.max(1, Math.floor((y1 - y0) / (ph * 2.2)));
  for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++){
    const sx = (x1 - x0) / cols, x = x0 + sx * (c + .5) + (r % 2 ? sx * .25 : -sx * .25);
    logo(g, 'dtl', x, y0 + (y1 - y0) * (r + .5) / rows, pw, ph);
  }

// metal crowd-control barriers (2 m panels, 1.1 m high) along a map-pixel path, in the item's local frame
function barricade(it){
  const g = new THREE.Group(), m = solid('#b9bec7', {metalness:.7, roughness:.35}), P = [];
  for (let i = 1; i < it.path.length; i++){
    const a = new V3(X(it.path[i-1][0]) - X(it.x), 0, Z(it.path[i-1][1]) - Z(it.y)), b = new V3(X(it.path[i][0]) - X(it.x), 0, Z(it.path[i][1]) - Z(it.y));
    const L = a.distanceTo(b), n = Math.max(1, Math.round(L / 2.05)), dir = b.clone().sub(a).normalize(), ang = Math.atan2(-dir.z, dir.x);
    for (let k = 0; k < n; k++) P.push({p:a.clone().addScaledVector(dir, (k + .5) * L / n), ang, len:L / n - .06});
  }
  const bars = new THREE.InstancedMesh(new THREE.CylinderGeometry(.01, .01, .86, 5), m, P.length * 15), o = new THREE.Object3D(); let bi = 0;
  P.forEach(({p, ang, len}) => {
    const pn = new THREE.Group(); pn.position.copy(p); pn.rotation.y = ang;
    [1.1, .22].forEach(y => { const r = new THREE.Mesh(new THREE.BoxGeometry(len, .035, .035), m); r.position.y = y; pn.add(r); });
    [-1, 1].forEach(sd => { const post = new THREE.Mesh(new THREE.BoxGeometry(.035, 1.1, .035), m); post.position.set(sd * len / 2, .55, 0); pn.add(post);
      const foot = new THREE.Mesh(new THREE.BoxGeometry(.06, .03, .7), m); foot.position.set(sd * (len / 2 - .15), .015, 0); pn.add(foot); });
    g.add(pn); pn.updateMatrix();
    for (let k = 1; k <= 15; k++){ o.position.set(-len / 2 + k * len / 16, .66, 0); o.rotation.set(0, 0, 0); o.updateMatrix(); o.matrix.premultiply(pn.matrix); bars.setMatrixAt(bi++, o.matrix); }
  });
  bars.count = bi; g.add(bars);
  it.top = 1.2;
  return g;
}

function place(it, g){
  g.position.set(X(it.x), 0, Z(it.y));
  if (it.rot) g.rotation.y = it.rot * Math.PI / 180;
  scene.add(g); register(it, g);
}

function build(it){
  const g = new THREE.Group();
  const c = CATS[it.cat];
  switch (it.kind){
    case 'none': ROOT[it.id] = null; return;
    case 'stage': {
      g.add(boxBooth(it));

        for (let x = 0; x < W; x += p) gg.fillRect(x, 0, 1, H); for (let y = 0; y < H; y += p) gg.fillRect(0, y, W, 1);
      }, 260);
      const frameM = new THREE.MeshStandardMaterial({color:col('#0c0d12'), roughness:.4, metalness:.3});
      const screen = new THREE.Mesh(new THREE.BoxGeometry(.12, sh + .2, sw + .2), [new THREE.MeshBasicMaterial({map:led}), frameM, frameM, frameM, frameM, frameM]);
      screen.position.set(bx + .24, it.ht + .55 + sh / 2, 0); g.add(screen);
      // truss header with lights above the screen
      const hdr = truss(L, .3); hdr.rotation.y = Math.PI / 2; hdr.position.set(bx + .3, it.ht + wallH + .2, 0); g.add(hdr);
      for (let i = 0; i < 6; i++){ const sp = new THREE.Mesh(new THREE.CylinderGeometry(.09, .12, .22, 10), frameM); sp.position.set(bx + .55, it.ht + wallH - .05, -L / 2 + .6 + i * (L - 1.2) / 5); sp.rotation.z = -.6; g.add(sp); }
      // speaker stacks
      [-1, 1].forEach(s => { const sp = new THREE.Mesh(new THREE.BoxGeometry(.8, 1.6, .8), new THREE.MeshStandardMaterial({color:col('#1a1a22')})); sp.position.set(it.w / S / 2 - .5, it.ht + .8, s * (it.h / S / 2 - .6)); g.add(sp); });

    }
    case 'wall': {
      const w = it.w / S, h = 2.6, d = .35;
      const front = new THREE.MeshStandardMaterial({map:textCanvas(it.label + '\nPHOTOWALL', w, h, {bg:c.bg, fg:'#ffffff', fill:.55})});
      const plain = new THREE.MeshStandardMaterial({color:col(c.bg)});

      m.position.y = h / 2; g.add(m);
      const base = new THREE.Mesh(new THREE.BoxGeometry(w + .2, .12, it.h / S), new THREE.MeshStandardMaterial({map:textCanvas(it.label, w + .2, it.h / S, {bg:c.bg, fg:'#fff'})}));

    }
    case 'rack': {

      const frames = new THREE.InstancedMesh(new THREE.BoxGeometry(.85, .06, .06), new THREE.MeshStandardMaterial({color:col('#e8eaf2')}), n * 2);

    case 'ramp': {
      const w = it.w / S, d = it.h / S;
      const bg = it.white ? '#ffffff' : c.bg, fg = it.white ? '#16183f' : '#ffffff';
      const side = new THREE.MeshStandardMaterial({color:col(bg)});

      slab.position.y = .13; g.add(slab);

        p.position.set(sd * .52, r - .15, 0); g.add(p);

      const n = 24, posts = new THREE.InstancedMesh(new THREE.CylinderGeometry(.08, .08, 1, 6), new THREE.MeshStandardMaterial({color:col('#e9c21b')}), n), o = new THREE.Object3D();
      for (let i = 0; i < n; i++){ const a = i / n * Math.PI * 2; o.position.set(Math.cos(a) * (r + .3), .5, Math.sin(a) * (r + .3)); o.updateMatrix(); posts.setMatrixAt(i, o.matrix); }

      const w = A.distanceTo(B);

      const sign = new THREE.Mesh(new THREE.BoxGeometry(w - .4, signH, .18), [white, white, white, white, face, face]);
      sign.position.y = postH - signH / 2 - .1; g.add(sign);
      [-1, 1].forEach(sd => {

    }
    default: {
      if (it.brand && it.shared){ ROOT[it.id] = null; return; }   // built together with its tent mate
      if (it.brand) g.add(brandBooth(it));
      else if (it.tent && it.tent !== 'big' && it.tent !== 'stage') g.add(tentBooth(it));
      else g.add(boxBooth(it, it.tent === 'big' ? {ht:it.ht || 2.6} : null));

        s.position.set(0, (it.top || it.ht || 2.2) + .02, 0); s.rotation.x = -Math.PI / 2; g.add(s);

  }
  place(it, g);
}

/* ---------- path helper ---------- */
function mkPath(pts){
  const p = pts.map(q => new V3(X(q[0]), 0, Z(q[1])));
  const L = [0]; for (let i = 1; i < p.length; i++) L.push(L[i-1] + p[i].distanceTo(p[i-1]));
  return {p, L, len:L[L.length-1], at(d, out, dir){
    d = Math.max(0, Math.min(d, this.len)); let i = 1;
    while (i < L.length - 1 && L[i] < d) i++;
    const t = (d - L[i-1]) / ((L[i] - L[i-1]) || 1);
    out.lerpVectors(p[i-1], p[i], t);
    if (dir) dir.subVectors(p[i], p[i-1]).normalize();
    return out;
  }};
}

  ITEMS.forEach(it => { if (it.cat === 'landmark' && it.kind !== 'gate') return; const d = Math.hypot(X(it.x) - p.x, Z(it.y) - p.z) - Math.max(it.w, it.h) / S * .3; if (d < bd){ bd = d; best = it; } });

/* ---------- loop ---------- */
const clock = new THREE.Clock();
const pv = new V3(), dv = new V3();
let statT = 0;
function frame(){
  const dt = Math.min(clock.getDelta(), .05), t = clock.elapsedTime;

  if (simOn){
    // walkers
    walkers.forEach(w => {
      const u = w.userData; u.d += u.v * dt;
      if (u.d > u.r.len){ u.d = 0; }
      u.r.at(u.d, pv, dv);
      w.position.set(pv.x - dv.z * u.off, Math.abs(Math.sin(t * 7 + u.ph)) * .06, pv.z + dv.x * u.off);
      w.rotation.y = Math.atan2(dv.x, dv.z);
    });
    // waves
    waveTimer += dt;
    if (waveTimer > (waveNo === 0 ? 5 : WAVE_EVERY)){ waveTimer = 0; releaseWave(); }
    riders.forEach(c => {
      const u = c.userData;
      if (u.state !== 'ride') return;
      if (u.delay > 0){ u.delay -= dt; return; }
      u.d += u.v * dt;
      if (u.d >= u.route.len){ u.state = 'start'; c.position.set(X(u.grid[0]), 0, Z(u.grid[1])); c.rotation.y = Math.PI; return; }
      u.route.at(u.d, pv, dv);
      c.position.set(pv.x, 0, pv.z);
      c.rotation.y = Math.atan2(-dv.z, dv.x);
      u.wheels.forEach(wh => wh.rotation.z -= u.v * dt / .32);
    });
    tdUpdate(dt);
    trees.forEach(tr => { tr.rotation.z = Math.sin(t * .8 + tr.userData.seed) * .015; });
  }

  statT += dt;
  if (statT > .5){
    statT = 0;
    const moving = riders.filter(c => c.userData.state === 'ride').length;
    const atStart = riders.filter(c => c.userData.state === 'start').length;
    $('stats').textContent = waveNo ? (moving ? `Wave ${waveNo} riding to the start` : `Wave ${waveNo} at the start · ${atStart} riders`) : 'Wave 1 lining up';
  }

  // camera
  if (mode === 'walk'){
    walkD += 2.4 * dt;
    if (walkD > WALK.len) walkD = 0;
    WALK.at(walkD, wp, dv); WALK.at(walkD + 4, wl);
    camera.position.lerp(wp.setY(1.7), walkD < .1 ? 1 : .2);
    wlook.lerp(wl.setY(1.4), .06);
    camera.lookAt(wlook);
    const n = nearestBooth(camera.position);
    if (n !== nearIt){ nearIt = n; if (n){ bar.title.textContent = 'Now passing: ' + n.name; bar.text.textContent = n.desc; } }
  } else {
    if (fly){
      fly.t += dt / fly.dur;
      const k = fly.t >= 1 ? 1 : (fly.t < .5 ? 4 * fly.t ** 3 : 1 - (-2 * fly.t + 2) ** 3 / 2);
      camera.position.lerpVectors(fly.fp, fly.tp, k);
      controls.target.lerpVectors(fly.ft, fly.tt, k);
      if (fly.t >= 1) fly = null;
    } else if (mode === 'tour' && playing){
      dwell += dt;
      bar.prog.style.width = Math.min(100, dwell / DWELL * 100) + '%';
      if (!reduced){ // slow drift around the stop
        const off = camera.position.clone().sub(controls.target);
        off.applyAxisAngle(new V3(0, 1, 0), dt * .04);
        camera.position.copy(controls.target).add(off);
      }
      if (dwell > DWELL) goStop(stop + 1);
    }
    if (!(mode === 'tour' && playing)) bar.prog.style.width = mode === 'tour' ? Math.min(100, dwell / DWELL * 100) + '%' : '0';
    controls.update();
  }

  if (ring.visible){ ring.material.opacity = .7 + Math.sin(t * 4) * .25; ring.rotation.z = t * .3; }

  renderer.render(scene, camera);
  updateTags();
  requestAnimationFrame(frame);
}

/* ---------- start once fonts are ready (labels are drawn with Oswald) ---------- */
function start(){
  $('loading').classList.add('done');
  setMode('tour', true); goStop(0); setPlaying(!reduced);
  // deep link to one booth, e.g. "FunRide Bike Village.html#booth=bdo" (optional &az=0.4 &dist=12)
  const hp = new URLSearchParams(location.hash.slice(1)), dl = BY[hp.get('booth')];
  if (dl){
    setMode('free'); select(dl);
    const v = viewFor(itemCenter(dl), parseFloat(hp.get('az')) || .35, parseFloat(hp.get('el')) || .45, parseFloat(hp.get('dist')) || Math.max(14, Math.max(dl.w, dl.h) / S * 2.4));
    fly = null; camera.position.copy(v.pos); controls.target.copy(v.tgt); controls.update();
  }
  requestAnimationFrame(frame);
}
start();
}
(function(){
  let done = false; const go = () => { if (!done){ done = true; boot(); } };
  // sponsor logos are embedded below as data URIs, so the page works opened straight from disk
  const imgs = window.FR_LOGO_IMG = {};
  const logos = Object.entries(window.FR_LOGOS || {}).map(([k, src]) => new Promise(res => { const im = new Image(); im.onload = im.onerror = res; im.src = src; imgs[k] = im; }));
  try { Promise.all([document.fonts.load('700 40px Oswald'), document.fonts.load('500 14px Oswald')].concat(logos)).then(go, go); } catch(e){ Promise.all(logos).then(go, go); }
  setTimeout(go, 4000);
})();
</script>
