<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>FunRide Bike Village</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
/* Layout: full-bleed 3D scene; floating map-legend style panels (navy / red / yellow flag stripe). Single light look by design. */
:root{
  --navy:#16187a; --navy-2:#23219c; --red:#c8202f; --yellow:#ffc928;
  --panel:rgba(255,255,255,.95); --ink:#16183f; --muted:#5b5f86; --line:#dfe2ef; --sky:#cfe6f7;
  --display:"Oswald","Arial Narrow",Impact,sans-serif; --body:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
[hidden]{display:none!important}
html,body{height:100%;background:var(--sky);color:var(--ink);font-family:var(--body);overflow:hidden}
#app{position:fixed;inset:0;overflow:hidden}
#scene{display:block;width:100%;height:100%;touch-action:none;cursor:grab}
#scene.hovering{cursor:pointer}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--yellow);outline-offset:2px}

.panel{background:var(--panel);border-radius:12px;box-shadow:0 6px 24px rgba(22,24,122,.16);backdrop-filter:blur(6px)}
.stripe{display:flex;gap:4px}
.stripe i{display:block;height:4px;border-radius:2px;width:22px}
.stripe i:nth-child(1){background:var(--navy-2)}.stripe i:nth-child(2){background:var(--red)}.stripe i:nth-child(3){background:var(--yellow)}

.brand{position:absolute;top:calc(env(safe-area-inset-top,0px) + 16px);left:max(16px,env(safe-area-inset-left,0px));padding:14px 16px 12px;display:grid;gap:6px;max-width:300px}
.brand .eyebrow{font:600 11px/1 var(--body);letter-spacing:.14em;text-transform:uppercase;color:var(--red)}
.brand h1{margin:0;font:700 28px/1 var(--display);letter-spacing:.02em;color:var(--navy);text-transform:uppercase}
.brand .sub{font-size:12px;color:var(--muted)}
.live{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;font-size:12px;color:var(--ink);font-variant-numeric:tabular-nums;margin-top:2px}
.live .dot{display:inline-flex;align-items:center;gap:6px;font:700 11px/1 var(--display);letter-spacing:.1em;color:#fff;background:var(--red);padding:4px 7px;border-radius:4px}
.live .dot::before{content:"";width:7px;height:7px;border-radius:50%;background:#fff;animation:blink 1.4s infinite}
@keyframes blink{50%{opacity:.25}}

.modes{position:absolute;top:calc(env(safe-area-inset-top,0px) + 16px);right:max(16px,env(safe-area-inset-right,0px));display:flex;gap:6px;padding:6px;flex-wrap:wrap;justify-content:flex-end}
.modes button{border:0;background:transparent;padding:8px 12px;border-radius:8px;font:600 13px/1 var(--body);color:var(--navy)}
.modes button:hover{background:#eef0fb}
.modes button[aria-pressed="true"]{background:var(--navy);color:#fff}
.modes .sep{width:1px;background:var(--line);margin:4px 2px}

#dir{position:absolute;top:calc(env(safe-area-inset-top,0px) + 76px);right:max(16px,env(safe-area-inset-right,0px));width:280px;max-height:calc(100% - 300px);display:flex;flex-direction:column;overflow:hidden}
#dir header{padding:12px 14px 8px;display:grid;gap:8px;border-bottom:1px solid var(--line)}
#dir h2{margin:0;font:700 15px/1 var(--display);letter-spacing:.08em;text-transform:uppercase;color:var(--navy)}
#dir input{width:100%;box-sizing:border-box;border:1px solid var(--line);border-radius:8px;padding:8px 10px;font:14px var(--body);background:#fff;color:var(--ink)}
#dir .list{overflow:auto;padding:6px 8px 12px}
.grp{margin-top:8px}
.grp h3{display:flex;align-items:center;gap:8px;margin:6px 6px 4px;font:700 12px/1.2 var(--display);letter-spacing:.08em;text-transform:uppercase;color:var(--navy)}
.sw{width:12px;height:12px;border-radius:3px;flex:none;box-shadow:inset 0 0 0 1px rgba(0,0,0,.12)}
.grp button{display:flex;width:100%;text-align:left;border:0;background:transparent;padding:6px 8px 6px 26px;border-radius:6px;font-size:13px;color:var(--ink)}
.grp button:hover,.grp button.on{background:#eef0fb;color:var(--navy)}
.grp button small{margin-left:auto;color:var(--muted)}
#dirToggle{display:none}

#bar{position:absolute;left:max(16px,env(safe-area-inset-left,0px));bottom:calc(env(safe-area-inset-bottom,0px) + 16px);width:min(560px,calc(100% - 32px));padding:14px 16px;display:grid;gap:8px}
#bar .kicker{display:flex;justify-content:space-between;gap:8px;font:600 11px/1 var(--body);letter-spacing:.12em;text-transform:uppercase;color:var(--red)}
#bar .kicker span:last-child{color:var(--muted);font-variant-numeric:tabular-nums}
#bar h2{margin:0;font:700 22px/1.1 var(--display);color:var(--navy);text-transform:uppercase;letter-spacing:.02em;text-wrap:balance}
#bar p{margin:0;font-size:14px;line-height:1.5;color:var(--ink);max-width:62ch}
.ctrls{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.ctrls button{border:1px solid var(--line);background:#fff;padding:8px 12px;border-radius:8px;font:600 13px/1 var(--body);color:var(--navy)}
.ctrls button.primary{background:var(--navy);border-color:var(--navy);color:#fff}
.ctrls button:hover{border-color:var(--navy)}
.dots{display:flex;gap:4px;flex-wrap:wrap;margin-left:auto}
.dots button{width:9px;height:9px;padding:0;border-radius:50%;border:0;background:#cdd1e6}
.dots button.on{background:var(--red)}
.progress{height:3px;background:#e6e8f3;border-radius:2px;overflow:hidden}
.progress i{display:block;height:100%;width:0;background:var(--yellow)}

#info{position:absolute;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(env(safe-area-inset-bottom,0px) + 16px);width:280px;padding:14px 16px;display:grid;gap:6px}
#info .cat{display:flex;align-items:center;gap:8px;font:600 11px/1 var(--body);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
#info h3{margin:0;font:700 20px/1.1 var(--display);color:var(--navy);text-transform:uppercase}
#info p{margin:0;font-size:13px;line-height:1.5}
#info .size{display:flex;flex-wrap:wrap;gap:4px 8px;align-items:baseline;font-size:12px;color:var(--muted)}
#info .size b{font:700 13px/1.2 var(--body);color:#fff;background:var(--navy);padding:4px 7px;border-radius:5px;font-variant-numeric:tabular-nums}
#info .x{position:absolute;top:8px;right:8px;border:0;background:transparent;font-size:18px;line-height:1;padding:6px;color:var(--muted)}

#tags{position:absolute;inset:0;pointer-events:none}
.tag{position:absolute;left:0;top:0;transform:translate(-50%,-100%);white-space:nowrap;font:600 11px/1 var(--body);color:#fff;background:var(--navy);padding:5px 7px;border-radius:5px;box-shadow:0 2px 8px rgba(0,0,0,.2)}
.tag::after{content:"";position:absolute;left:50%;bottom:-4px;margin-left:-4px;border:4px solid transparent;border-bottom:0;border-top-color:var(--navy)}
.tag.hover{background:var(--red)}.tag.hover::after{border-top-color:var(--red)}

#loading{position:absolute;inset:0;display:grid;place-items:center;background:var(--sky);font:700 18px var(--display);letter-spacing:.1em;text-transform:uppercase;color:var(--navy);transition:opacity .6s}
#loading.done{opacity:0;pointer-events:none}
#toast{position:absolute;left:50%;top:calc(env(safe-area-inset-top,0px) + 16px);transform:translate(-50%,-140%);background:var(--red);color:#fff;font:700 14px/1 var(--display);letter-spacing:.08em;text-transform:uppercase;padding:9px 14px;border-radius:8px;transition:transform .35s;pointer-events:none}
#toast.show{transform:translate(-50%,0)}

@media (max-width:820px){
  .brand{padding:10px 12px;max-width:calc(100% - 32px)}
  .brand h1{font-size:22px}
  .modes{top:auto;right:auto;left:max(16px,env(safe-area-inset-left,0px));bottom:auto;position:absolute;top:calc(env(safe-area-inset-top,0px) + 128px);flex-wrap:nowrap;overflow-x:auto;max-width:calc(100% - 32px);box-sizing:border-box;justify-content:flex-start}
  .modes button{white-space:nowrap;padding:8px 10px}
  #dirToggle{display:inline-block}
  #dir{display:none;top:calc(env(safe-area-inset-top,0px) + 180px);left:max(16px,env(safe-area-inset-left,0px));right:max(16px,env(safe-area-inset-right,0px));width:auto;max-height:calc(100% - 200px);z-index:5}
  #dir.open{display:flex}
  #bar{width:calc(100% - 32px);box-sizing:border-box;padding:12px}
  #bar h2{font-size:18px}
  #bar p{font-size:13px}
  #info{left:max(16px,env(safe-area-inset-left,0px));width:auto;bottom:auto;top:calc(env(safe-area-inset-top,0px) + 180px);z-index:6}
}
@media (prefers-reduced-motion:reduce){.live .dot::before{animation:none}}
</style>

<div id="app">

    <p id="iDesc"></p>
  </div>
  <div id="toast"></div>
  <div id="loading">Building the bike village…</div>
</div>

/* ---------- textures with text ---------- */
const FONT = 'Oswald, "Arial Narrow", Impact, sans-serif';
function textCanvas(text, wU, hU, o){
  o = o || {};
  const ppu = o.ppu || 40;
  let cw = Math.max(32, Math.round(wU * ppu)), ch = Math.max(32, Math.round(hU * ppu));
  const k = Math.min(1, 1024 / Math.max(cw, ch)); cw = Math.round(cw * k); ch = Math.round(ch * k);
  const cv = document.createElement('canvas'); cv.width = cw; cv.height = ch;
  const g = cv.getContext('2d');
  if (o.pill){
    const r = Math.min(cw, ch) * .5;
    g.fillStyle = o.bg; g.beginPath();
    if (g.roundRect) g.roundRect(1, 1, cw - 2, ch - 2, r); else g.rect(0, 0, cw, ch);
    g.fill();
  } else if (o.bg){ g.fillStyle = o.bg; g.fillRect(0, 0, cw, ch); }
  if (o.border){ g.strokeStyle = o.border; g.lineWidth = Math.max(2, Math.min(cw, ch) * .04); g.strokeRect(0, 0, cw, ch); }
  if (text){
    g.save();
    let W = cw, H = ch;
    if (o.vert){ g.translate(cw / 2, ch / 2); g.rotate(-Math.PI / 2); W = ch; H = cw; g.translate(-W / 2, -H / 2); }
    const lines = text.split('\n');
    let fs = H * (o.fill || .62) / lines.length;
    g.font = `700 ${fs}px ${FONT}`;
    const mw = Math.max(...lines.map(l => g.measureText(l).width));
    const maxW = W * (o.pill ? .8 : .86);
    if (mw > maxW) fs *= maxW / mw;
    g.font = `700 ${fs}px ${FONT}`;
    g.fillStyle = o.fg; g.textAlign = 'center'; g.textBaseline = 'middle';
    lines.forEach((l, i) => g.fillText(l, W / 2, H / 2 + (i - (lines.length - 1) / 2) * fs * 1.08));
    g.restore();
  }
  const t = new THREE.CanvasTexture(cv);
  t.encoding = THREE.sRGBEncoding; t.anisotropy = renderer.capabilities.getMaxAnisotropy();
  return t;
}
function faceMat(text, wU, hU, bg, fg, vert){
  if (!text || wU * hU < .35) return new THREE.MeshStandardMaterial({color:col(bg), roughness:.75});
  return new THREE.MeshStandardMaterial({map:textCanvas(text, wU, hU, {bg, fg, vert}), roughness:.75});
}
function flatLabel(text, px, py, wpx, hpx, o){

  m.renderOrder = 2;
  scene.add(m);
  return m;
}

function dashes(x1, y1, x2, y2, dash, gap, width, y, mat){
  const a = new V3(X(x1), 0, Z(y1)), b = new V3(X(x2), 0, Z(y2));
  const L = a.distanceTo(b), dir = b.clone().sub(a).normalize(), ang = Math.atan2(-dir.z, dir.x);
  const geo = new THREE.BoxGeometry(dash, .02, width);
  const n = Math.floor(L / (dash + gap));
  const im = new THREE.InstancedMesh(geo, mat || dashMat, n);
  const o = new THREE.Object3D();
  for (let i = 0; i < n; i++){
    const d = i * (dash + gap) + dash / 2;
    o.position.copy(a).addScaledVector(dir, d); o.position.y = y || .03; o.rotation.set(0, ang, 0); o.updateMatrix();
    im.setMatrixAt(i, o.matrix);
  }
  scene.add(im); return im;
}

function tentBooth(it){
  const c = CATS[it.cat], w = it.w / S, d = it.h / S, g = new THREE.Group();
  const label = it.label != null ? it.label : it.name.toUpperCase();

  const plain = new THREE.MeshStandardMaterial({color:col(c.bg), roughness:.7});
  const topMat = new THREE.MeshStandardMaterial({map:textCanvas(label, w, d, {bg:c.bg, fg:c.fg, vert:it.vert}), roughness:.7});
  // footprint on the ground, so the real size reads in top view too
  const pad = new THREE.Mesh(new THREE.PlaneGeometry(w, d), new THREE.MeshStandardMaterial({color:col(c.bg), roughness:1, transparent:true, opacity:.35}));
  pad.rotation.x = -Math.PI / 2; pad.position.y = .045; g.add(pad);

  if (it.tent === 'stall'){
    // booth stall only: counter + back panel with header
    const counter = new THREE.Mesh(new THREE.BoxGeometry(w * .9, 1, .5), [plain, plain, topMat, plain, faceMat(flat, w * .9, 1, c.bg, c.fg), faceMat(flat, w * .9, 1, c.bg, c.fg)]);
    counter.position.set(0, .5, d / 2 - .35); g.add(counter);
    const panel = new THREE.Mesh(new THREE.BoxGeometry(w, 2.2, .08), [plain, plain, plain, plain, faceMat(flat, w, 2.2, c.bg, c.fg), plain]);
    panel.position.set(0, 1.1, -d / 2 + .1); g.add(panel);
    it.top = 2.2; return g;
  }

  if (it.tent === 'aircon'){
    // enclosed VIP tent: white walls, peaked roof, door on the front, AC unit at the back
    const wallH = 2.5, white = new THREE.MeshStandardMaterial({color:col('#f4f6fb'), roughness:.6});
    const wallFace = (a, b) => faceMat(flat, a, b, '#f4f6fb', '#16187a');
    const box = new THREE.Mesh(new THREE.BoxGeometry(w, wallH, d), [wallFace(d, wallH), wallFace(d, wallH), white, white, wallFace(w, wallH), wallFace(w, wallH)]);
    box.position.y = wallH / 2; g.add(box);
    const roof = new THREE.Mesh(new THREE.BoxGeometry(w + .3, .22, d + .3), [plain, plain, topMat, plain, plain, plain]);
    roof.position.y = wallH + .11; g.add(roof);

    it.top = wallH + .3; return g;

  // pop-up canopy (open tent / tent with back siding)
  const eave = 2.3, valH = .3;
  [[-1, -1], [1, -1], [1, 1], [-1, 1]].forEach(([sx, sz]) => {

  const canopy = new THREE.Mesh(new THREE.BoxGeometry(w, valH, d), [
    faceMat(flat, d, valH * 3, c.bg, c.fg), faceMat(flat, d, valH * 3, c.bg, c.fg), topMat, plain,
    faceMat(flat, w, valH * 3, c.bg, c.fg), faceMat(flat, w, valH * 3, c.bg, c.fg)]);
  canopy.position.y = eave + valH / 2; g.add(canopy);
  if (it.tent === 'back'){
    const along = bx !== 0 ? d : w;
    const wall = new THREE.Mesh(new THREE.BoxGeometry(along, eave, .05), plain);

/* ---------- path helper ---------- */
function mkPath(pts){
  const p = pts.map(q => new V3(X(q[0]), 0, Z(q[1])));
  const L = [0]; for (let i = 1; i < p.length; i++) L.push(L[i-1] + p[i].distanceTo(p[i-1]));
  return {p, L, len:L[L.length-1], at(d, out, dir){
    d = Math.max(0, Math.min(d, this.len)); let i = 1;
    while (i < L.length - 1 && L[i] < d) i++;
    const t = (d - L[i-1]) / ((L[i] - L[i-1]) || 1);
    out.lerpVectors(p[i-1], p[i], t);
    if (dir) dir.subVectors(p[i], p[i-1]).normalize();
    return out;
  }};
}

}
const riders = [];
for (let i = 0; i < 72; i++){ const c = makeCyclist(); c.visible = false; c.userData.state = 'idle'; scene.add(c); riders.push(c); }
for (let i = 0; i < 15; i++) parkAt(riders[i], PARK[i]);
let waveNo = 0, finished = 0, waveTimer = 0;
const WAVE_EVERY = 24;
function fillStandby(){
  let n = 0;
  for (const c of riders){
    if (n >= SLOTS.length) break;
    if (c.userData.state !== 'idle') continue;
    const s = SLOTS[n++];
    Object.assign(c.userData, {state:'wait', slot:s, route:null, d:0, delay:0, counted:false});
    c.position.set(X(s[0]) + (Math.random() - .5) * .6, 0, Z(s[1]) + (Math.random() - .5) * .6);
    c.rotation.y = 0; c.visible = true;
  }
}
function releaseWave(){
  waveNo++;
  // the wave already at the start has gone off; make room for the new one
  riders.forEach(c => { if (c.userData.state === 'start'){ c.userData.state = 'idle'; c.visible = false; } });
  let k = 0;
  riders.forEach(c => { if (c.userData.state === 'wait'){ const u = c.userData; u.grid = GRID[k % GRID.length]; u.state = 'ride'; u.route = rideRoute(u.slot, u.grid); u.d = 0; u.delay = k++ * .55; u.v = 7 + Math.random() * 1.5; u.lane = 0; } });
  toast(`Wave ${waveNo} heading to the start`);
  setTimeout(fillStandby, 4000);
}
fillStandby();

/* ---------- selection ring ---------- */
const ring = new THREE.Mesh(new THREE.RingGeometry(1, 1.18, 48), new THREE.MeshBasicMaterial({color:col('#ffc928'), transparent:true, opacity:.95, depthWrite:false}));
ring.rotation.x = -Math.PI / 2; ring.position.y = .07; ring.visible = false; ring.renderOrder = 3; scene.add(ring);
let selected = null;
function itemCenter(it){ return new V3(X(it.x), 0, Z(it.y)); }
function itemTop(it){ const h = it.kind === 'arch' ? it.h / S / 2 + 1.2 : it.kind === 'wall' ? 2.6 : it.kind === 'stage' ? it.ht + 4 : it.kind === 'gate' ? 3.1 : it.kind === 'restricted' ? .4 : it.id === 'grandstand' ? 1.9 : (it.top || it.ht || 2.2); return itemCenter(it).setY(h + .5); }
function select(it){
  selected = it;
  if (!it){ ring.visible = false; infoEl.hidden = true; renderDirOn(); return; }
  ring.visible = true; ring.position.x = X(it.x); ring.position.z = Z(it.y);
  const rr = Math.min(10, Math.max(it.w, it.h) / S * .62 + .6); ring.scale.setScalar(rr);
  infoEl.hidden = false;
  document.getElementById('iSw').style.background = CATS[it.cat].bg;
  document.getElementById('iCat').textContent = CATS[it.cat].name;
  document.getElementById('iName').textContent = it.name;
  document.getElementById('iDesc').textContent = it.desc;
  const sizeEl = document.getElementById('iSize');
  sizeEl.hidden = !it.sz;
  if (it.sz){ document.getElementById('iSzV').textContent = it.sz; document.getElementById('iType').textContent = it.tent ? TENT[it.tent] : ''; }
  renderDirOn();
}

/* ---------- camera flights ---------- */
let fly = null;
function viewFor(target, az, el, dist){
  return {tgt:target.clone(), pos:new V3(target.x + dist * Math.cos(el) * Math.sin(az), target.y + dist * Math.sin(el), target.z + dist * Math.cos(el) * Math.cos(az))};
}
function flyTo(v, dur){
  fly = {fp:camera.position.clone(), ft:controls.target.clone(), tp:v.pos, tt:v.tgt, t:0, dur:reduced ? .01 : (dur || 2.2)};
}
function centroid(ids){
  const c = new V3(); ids.forEach(id => c.add(itemCenter(BY[id]))); return c.multiplyScalar(1 / ids.length);
}
function stopView(s){
  const tgt = s.target ? new V3(X(s.target[0]), 0, Z(s.target[1])) : centroid(s.ids);
  let dist = s.dist;
  if (innerWidth < 820) dist *= 1.35;
  return viewFor(tgt, s.az, s.el, dist);
}
function flyToItem(it){
  const off = camera.position.clone().sub(controls.target);
  const az = Math.atan2(off.x, off.z);
  const size = Math.max(it.w, it.h) / S;
  flyTo(viewFor(itemCenter(it), az, .6, Math.max(14, size * 2.4) * (innerWidth < 820 ? 1.3 : 1)), 1.6);
}

/* ---------- UI ---------- */
const $ = id => document.getElementById(id);
const infoEl = $('info');
const bar = {kick:$('bKick'), count:$('bCount'), title:$('bTitle'), text:$('bText'), prog:$('bProg').firstElementChild, ctrls:$('bCtrls'), progWrap:$('bProg')};
let mode = 'tour', stop = 0, playing = !reduced, dwell = 0;
const DWELL = 9;
const dotsEl = $('dots');
TOUR.forEach((s, i) => { const b = document.createElement('button'); b.setAttribute('aria-label', `Stop ${i + 1}: ${s.t}`); b.onclick = () => { goStop(i); }; dotsEl.appendChild(b); });
let focusIds = [];
function goStop(i){
  setMode('tour', true);
  stop = (i + TOUR.length) % TOUR.length; dwell = 0;
  const s = TOUR[stop];
  bar.kick.textContent = s.k; bar.count.textContent = `Stop ${stop + 1} of ${TOUR.length}`;
  bar.title.textContent = s.t; bar.text.textContent = s.d;
  [...dotsEl.children].forEach((b, j) => b.classList.toggle('on', j === stop));
  focusIds = s.ids.slice();
  select(null);
  flyTo(stopView(s));
}
function setPlaying(p){ playing = p; $('play').textContent = p ? 'Pause tour' : 'Play tour'; }
$('prev').onclick = () => goStop(stop - 1);
$('next').onclick = () => goStop(stop + 1);
$('play').onclick = () => { setPlaying(!playing); if (playing) dwell = 0; };

function setMode(m, silent){
  mode = m;
  ['mTour','mWalk','mFree','mTop'].forEach(id => $(id).setAttribute('aria-pressed', 'false'));
  $({tour:'mTour', walk:'mWalk', free:'mFree', top:'mTop'}[m]).setAttribute('aria-pressed', 'true');
  controls.enabled = m !== 'walk';
  const tourUI = m === 'tour';
  bar.ctrls.hidden = !tourUI; bar.progWrap.hidden = !tourUI;
  if (silent) return;
  focusIds = [];
  if (m === 'tour'){ setPlaying(!reduced); goStop(stop); }
  if (m === 'free'){
    bar.kick.textContent = 'Explore freely'; bar.count.textContent = '';
    bar.title.textContent = 'Look around the village';
    bar.text.textContent = 'Drag to orbit, right-drag or two fingers to pan, scroll or pinch to zoom. Tap any booth to see what it is, or pick one from the booth list.';
  }
  if (m === 'top'){
    bar.kick.textContent = 'Top view'; bar.count.textContent = '';
    bar.title.textContent = 'The site map in 3D';
    bar.text.textContent = 'Same layout as the printed site map: Roxas Boulevard at the top, Independence Road at the bottom. Drag to tilt back into 3D.';
    flyTo({pos:new V3(0, innerWidth < 820 ? 200 : 132, .1), tgt:new V3(0, 0, 0)}, 2);
  }
  if (m === 'walk'){
    walkD = 0; select(null);
    bar.kick.textContent = 'Walk the lanes'; bar.count.textContent = '';
    bar.title.textContent = 'Entering from Independence Road';
    bar.text.textContent = 'You are walking the red rider-flow lanes at eye level, from the Entrance through the booths to the Exit.';
  }
}
$('mTour').onclick = () => setMode('tour');
$('mWalk').onclick = () => setMode('walk');
$('mFree').onclick = () => setMode('free');
$('mTop').onclick = () => setMode('top');
let simOn = true;
$('mSim').onclick = () => { simOn = !simOn; $('mSim').setAttribute('aria-pressed', simOn); $('mSim').textContent = simOn ? 'Simulation on' : 'Simulation off'; };
$('dirToggle').onclick = () => { const o = $('dir').classList.toggle('open'); $('dirToggle').setAttribute('aria-pressed', o); };
$('infoX').onclick = () => select(null);

// directory
const listEl = $('list');
const ORDER = ['stage','sponsor','tent','byd','dot','ops','merch','standby','start','cardinal','restricted','landmark'];
function renderDir(q){
  q = (q || '').trim().toLowerCase();
  listEl.innerHTML = '';
  ORDER.forEach(cat => {
    const items = ITEMS.filter(it => it.cat === cat && (!q || it.name.toLowerCase().includes(q) || CATS[cat].name.toLowerCase().includes(q)));
    if (!items.length) return;
    const g = document.createElement('div'); g.className = 'grp';
    g.innerHTML = `<h3><span class="sw" style="background:${CATS[cat].bg}"></span>${CATS[cat].name}<small style="margin-left:auto;font:500 11px var(--body);color:var(--muted)">${items.length}</small></h3>`;
    items.forEach(it => {
      const b = document.createElement('button'); b.textContent = it.name; b.dataset.id = it.id;
      if (it.ft || it.sz === 'To follow'){ const sm = document.createElement('small'); sm.textContent = it.ft ? `${fmtFt(it.ft[0])}×${fmtFt(it.ft[1])} ft` : 'size TBA'; b.appendChild(sm); }
      b.onclick = () => { if (mode === 'walk' || mode === 'tour') setMode('free'); select(it); flyToItem(it); $('dir').classList.remove('open'); };
      g.appendChild(b);
    });
    listEl.appendChild(g);
  });
  renderDirOn();
}
function renderDirOn(){ listEl.querySelectorAll('button').forEach(b => b.classList.toggle('on', !!selected && b.dataset.id === selected.id)); }
$('q').addEventListener('input', e => renderDir(e.target.value));
renderDir('');

// toast
let toastT;
function toast(msg){ const t = $('toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 2600); }

// clock (Manila time)
function tick(){ try { $('clock').textContent = new Intl.DateTimeFormat('en-PH', {hour:'2-digit', minute:'2-digit', timeZone:'Asia/Manila'}).format(new Date()) + ' PHT'; } catch(e){} }
tick(); setInterval(tick, 15000);

/* ---------- picking ---------- */
const ray = new THREE.Raycaster(), ndc = new THREE.Vector2();
let hoverIt = null, downAt = null;
function pick(e){
  const r = canvas.getBoundingClientRect();
  ndc.set((e.clientX - r.left) / r.width * 2 - 1, -(e.clientY - r.top) / r.height * 2 + 1);
  ray.setFromCamera(ndc, camera);
  const hit = ray.intersectObjects(pickables, false)[0];
  return hit ? hit.object.userData.item : null;
}
canvas.addEventListener('pointermove', e => {
  if (e.pointerType !== 'mouse' || mode === 'walk') return;
  hoverIt = pick(e); canvas.classList.toggle('hovering', !!hoverIt);
});
canvas.addEventListener('pointerdown', e => { downAt = [e.clientX, e.clientY]; if (mode === 'tour') setPlaying(false); fly = null; });
canvas.addEventListener('pointerup', e => {
  if (!downAt || Math.hypot(e.clientX - downAt[0], e.clientY - downAt[1]) > 6 || mode === 'walk') return;
  const it = pick(e);
  if (it){ select(it); flyToItem(it); } else select(null);
});
canvas.addEventListener('wheel', () => { fly = null; if (mode === 'tour') setPlaying(false); }, {passive:true});
addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT') return;
  if (e.key === 'ArrowRight') goStop(stop + 1);
  if (e.key === 'ArrowLeft') goStop(stop - 1);
  if (e.key === 'Escape') select(null);
});

/* ---------- floating name tags ---------- */
const tagsEl = $('tags'), tagPool = {};
function tagFor(it){ let t = tagPool[it.id]; if (!t){ t = document.createElement('div'); t.className = 'tag'; t.textContent = it.name; tagsEl.appendChild(t); tagPool[it.id] = t; } return t; }
const tmp = new V3();
function updateTags(){
  const show = new Set(focusIds);
  if (selected) show.add(selected.id);
  if (hoverIt) show.add(hoverIt.id);
  if (mode === 'walk' && nearIt) show.add(nearIt.id);
  const r = canvas.getBoundingClientRect();
  for (const id in tagPool) if (!show.has(id)) tagPool[id].style.display = 'none';
  show.forEach(id => {
    const it = BY[id]; const t = tagFor(it);
    tmp.copy(itemTop(it)).project(camera);
    if (tmp.z > 1 || Math.abs(tmp.x) > 1.1 || Math.abs(tmp.y) > 1.1){ t.style.display = 'none'; return; }
    t.style.display = 'block';
    t.classList.toggle('hover', hoverIt === it || selected === it);
    t.style.transform = `translate(${(tmp.x + 1) / 2 * r.width}px, ${(1 - tmp.y) / 2 * r.height}px) translate(-50%, -100%)`;
  });
}

/* ---------- walk mode ---------- */
const WALK = mkPath([[1075,915],[1022,890],[1000,850],[1000,795],[945,795],[945,600],[945,450],[870,450],[700,450],[688,460],[688,587],[580,587],[572,600],[572,765],[590,830],[645,830],[645,880],[617,905],[600,975]]);
let walkD = 0, nearIt = null;
const wp = new V3(), wl = new V3(), wlook = new V3(0, 1.6, 0);
function nearestBooth(p){
  let best = null, bd = 7.5;
  ITEMS.forEach(it => { if (it.cat === 'landmark' && it.kind !== 'gate') return; const d = Math.hypot(X(it.x) - p.x, Z(it.y) - p.z) - Math.max(it.w, it.h) / S * .3; if (d < bd){ bd = d; best = it; } });
  return best;
}

/* ---------- resize ---------- */
function resize(){
  const w = canvas.clientWidth, h = canvas.clientHeight;
  renderer.setSize(w, h, false); camera.aspect = w / h; camera.updateProjectionMatrix();
}
addEventListener('resize', resize); resize();

/* ---------- loop ---------- */
const clock = new THREE.Clock();
const pv = new V3(), dv = new V3();
let statT = 0;
function frame(){
  const dt = Math.min(clock.getDelta(), .05), t = clock.elapsedTime;

  if (simOn){
    // walkers
    walkers.forEach(w => {
      const u = w.userData; u.d += u.v * dt;
      if (u.d > u.r.len){ u.d = 0; }
      u.r.at(u.d, pv, dv);
      w.position.set(pv.x - dv.z * u.off, Math.abs(Math.sin(t * 7 + u.ph)) * .06, pv.z + dv.x * u.off);
      w.rotation.y = Math.atan2(dv.x, dv.z);
    });
    // waves
    waveTimer += dt;
    if (waveTimer > (waveNo === 0 ? 5 : WAVE_EVERY)){ waveTimer = 0; releaseWave(); }
    riders.forEach(c => {
      const u = c.userData;
      if (u.state !== 'ride') return;
      if (u.delay > 0){ u.delay -= dt; return; }
      u.d += u.v * dt;
      if (u.d >= u.route.len){ u.state = 'start'; c.position.set(X(u.grid[0]), 0, Z(u.grid[1])); c.rotation.y = Math.PI; return; }
      u.route.at(u.d, pv, dv);
      c.position.set(pv.x, 0, pv.z);
      c.rotation.y = Math.atan2(-dv.z, dv.x);
      u.wheels.forEach(wh => wh.rotation.z -= u.v * dt / .32);
    });
    trees.forEach(tr => { tr.rotation.z = Math.sin(t * .8 + tr.userData.seed) * .015; });
  }

  statT += dt;
  if (statT > .5){
    statT = 0;
    const moving = riders.filter(c => c.userData.state === 'ride').length;
    const atStart = riders.filter(c => c.userData.state === 'start').length;
    $('stats').textContent = waveNo ? (moving ? `Wave ${waveNo} riding to the start` : `Wave ${waveNo} at the start · ${atStart} riders`) : 'Wave 1 lining up';
  }

  // camera
  if (mode === 'walk'){
    walkD += 2.4 * dt;
    if (walkD > WALK.len) walkD = 0;
    WALK.at(walkD, wp, dv); WALK.at(walkD + 4, wl);
    camera.position.lerp(wp.setY(1.7), walkD < .1 ? 1 : .2);
    wlook.lerp(wl.setY(1.4), .06);
    camera.lookAt(wlook);
    const n = nearestBooth(camera.position);
    if (n !== nearIt){ nearIt = n; if (n){ bar.title.textContent = 'Now passing: ' + n.name; bar.text.textContent = n.desc; } }
  } else {
    if (fly){
      fly.t += dt / fly.dur;
      const k = fly.t >= 1 ? 1 : (fly.t < .5 ? 4 * fly.t ** 3 : 1 - (-2 * fly.t + 2) ** 3 / 2);
      camera.position.lerpVectors(fly.fp, fly.tp, k);
      controls.target.lerpVectors(fly.ft, fly.tt, k);
      if (fly.t >= 1) fly = null;
    } else if (mode === 'tour' && playing){
      dwell += dt;
      bar.prog.style.width = Math.min(100, dwell / DWELL * 100) + '%';
      if (!reduced){ // slow drift around the stop
        const off = camera.position.clone().sub(controls.target);
        off.applyAxisAngle(new V3(0, 1, 0), dt * .04);
        camera.position.copy(controls.target).add(off);
      }
      if (dwell > DWELL) goStop(stop + 1);
    }
    if (!(mode === 'tour' && playing)) bar.prog.style.width = mode === 'tour' ? Math.min(100, dwell / DWELL * 100) + '%' : '0';
    controls.update();
  }

  if (ring.visible){ ring.material.opacity = .7 + Math.sin(t * 4) * .25; ring.rotation.z = t * .3; }

  renderer.render(scene, camera);
  updateTags();
  requestAnimationFrame(frame);
}

/* ---------- start once fonts are ready (labels are drawn with Oswald) ---------- */
function start(){
  $('loading').classList.add('done');
  setMode('tour', true); goStop(0); setPlaying(!reduced);
  requestAnimationFrame(frame);
}
start();
}
(function(){
  let done = false; const go = () => { if (!done){ done = true; boot(); } };
  try { Promise.all([document.fonts.load('700 40px Oswald'), document.fonts.load('500 14px Oswald')]).then(go, go); } catch(e){ go(); }
  setTimeout(go, 2500);
})();
</script>
